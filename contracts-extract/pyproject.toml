[project]
name = "matcon-extract"
version = "0.1.0"
description = "Deterministic entity extraction from contract text: offset spans, no inferred values."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthias Uckert" }]
keywords = ["nlp", "information-extraction", "contracts", "sec", "edgar", "regex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Science/Research",
]

# EVERY IMPORT IS DECLARED, INCLUDING tqdm. In contracts-engine tqdm arrived transitively through
# spaCy and was never listed; a package split out of that environment and installed on its own
# would import it and die. scikit-learn had the same problem on the keyword side and was in
# neither the pyproject nor the lock.
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
matcon-extract = "matcon_extract.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matcon_extract"]

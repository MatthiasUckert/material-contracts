# _quarto.yml -- the root project: the pipeline runbooks in 1_code/.
#
# HTML ONLY. There is no pdf format. The runbooks are read on screen, they carry console blocks that
# scroll horizontally and tables wider than a page, and neither survives a fixed page size without
# being cut down into something worse. What the manuscript needs from this pipeline is figures, and
# those come from plot_save(), which writes real vector PDFs straight to disk and has nothing to do
# with the format list below.
#
# There is a SECOND Quarto project in this repository, 3_site/, which builds the public site into
# docs/. The two share nothing but the repository. The `render:` list below is what keeps them
# apart -- see the note on it.

project:
  # Run every document's code from the PROJECT ROOT (not the .qmd's own folder), so repo-root-relative
  # paths like source("1_code/_Commons/_Initialize.R") and here::here() resolve the same way they do
  # interactively in RStudio. Without this Quarto defaults to execute-dir: file (the .qmd's directory)
  # and those paths break.
  execute-dir: project

  # Rendered HTML lands here, mirroring the input path, e.g.
  # 1_code/03A-ClassifyPrepare.qmd -> _rendered/1_code/03A-ClassifyPrepare.html.
  # R-side artifacts (parquet, runs) are written directly by arrow/fs under 2_output/ and are NOT
  # affected by this. Note: `quarto render` with no argument renders the WHOLE project; use
  # `quarto render <file.qmd>` for a single document.
  output-dir: _rendered

  # WHAT A BARE `quarto render` IS ALLOWED TO TOUCH.
  #
  # Without this list, `quarto render` at the repository root walks every directory it can see and
  # renders every .qmd it finds under THIS project's format. That includes 3_site/, whose pages are a
  # website project with its own format and its own output directory: they would be rendered as
  # self-contained articles into _rendered/ instead, and the site would appear to build while
  # producing nothing usable.
  #
  # Underscore-prefixed directories (_BackUp, _Commons, _Tests, _Migration, _Scripts) are already
  # invisible to Quarto, so the probe document in 1_code/_Tests is unaffected by this list and is
  # rendered by naming it explicitly.
  render:
    - "1_code/*.qmd"

format:
  html:
    # embed-resources supersedes self-contained, which is deprecated. One file, no _files/ directory
    # beside it, so a report can be emailed or copied into docs/reports/ as a single asset.
    embed-resources: true

    toc: true
    toc-location: left
    toc-depth: 4
    toc-expand: 3
    toc-title: "Contents"

    # Every section head gets a hover anchor, so a specific finding can be linked to in a mail or a
    # response memo rather than described as "about two thirds down".
    anchor-sections: true

    page-layout: article
    code-fold: true
    code-overflow: wrap
    code-line-numbers: true
    code-copy: true

    # `theme: none` means this project ships no Bootstrap and no theme SCSS: _styles.css carries the
    # entire look. It is kept deliberately. The site injects a fixed back-link pill into these files
    # by anchoring on <body class="quarto-light">, and the reports' fixed left rail assumes no
    # competing chrome; introducing a Bootstrap theme would change both.
    #
    # mainfont/fontfamily are NOT set here. They are pdf/typst options and set nothing in html; with
    # the pdf format gone they have no meaning anywhere in this file. The html face is set by
    # --mc-font-prose in _styles.css, which is also where the printed-page rules live: browser
    # print-to-PDF still works and is styled in section 12 of that sheet.
    theme: none
    css: _styles.css

    # FIGURE GEOMETRY -- declared once, here, for every document in the project.
    #
    # Width is fixed and never varies. A figure that appears to need a wider canvas almost always
    # needs shorter labels instead: identifiers built for uniqueness run to eighty characters and
    # will consume any width they are given. _Plots.R supplies plot_wrap() and the level registry's
    # short labels for exactly this.
    #
    # Height varies with row count, chosen from the ladder in plot_height() rather than typed by
    # hand. The default below is the ladder's middle rung, so a chunk that forgets to set a height
    # still lands on the ladder instead of at some arbitrary value.
    #
    # This was previously restated in every document's setup chunk. Ten copies of one setting is how
    # two documents came to render at more than twice the width of the other eight, with no error and
    # no visible symptom beyond axis text at half size. It is declared once now, and setup chunks
    # must not override it.
    fig-align: center
    fig-width: 7.5
    fig-height: 3.4
    out-width: "100%"

knitr:
  opts_chunk:
    # ragg rasterises text with the actual system font, so what the HTML shows is what the font
    # resolution really produced. An SVG device would defer that to whatever the reader's browser has
    # installed and could silently substitute a different face for the figure font -- the failure
    # _Plots.R now warns about at source time.
    #
    # Rasterising costs nothing that matters, because the vector copies the manuscript needs are not
    # produced by this render at all: plot_save(.formats = c("pdf", "png")) writes them straight to
    # 2_output/<script>/Figures/ from within the document. That call is unaffected by the removal of
    # the pdf format and must stay.
    dev: "ragg_png"
    dpi: 200
